<html>
<body>
<script type="text/javascript">
//<!--
var a = 33;
var b = 10;
var c = "Test";
var linebreak = "<br />";
document.write("a + b = ");
result = a + b; //realiza la suma
document.write(result);
document.write(linebreak);
document.write("a - b = ");
result = a - b; //realiza la resta
document.write(result);
document.write(linebreak);
document.write("a / b = ");
result = a / b; //realiza la division
document.write(result);
document.write(linebreak);
document.write("a % b = ");
result = a % b; //realiza la muestra del resto
document.write(result);
document.write(linebreak);
document.write("a + b + c = ");
result = a + b + c; //realiza la suma de tres valores
document.write(result);
document.write(linebreak);
a = a++;
document.write("a++ = ");
result = a++; //muestra a
document.write(result);
document.write(linebreak);
b = b--; 
document.write("b-- = ");
result = b--; //muestra b
document.write(result);
document.write(linebreak);
//-->
</script>
<p>Set the variables to different values and then try...</p>
</body>
</html>
